<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEETS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #242424;
    --text: #f0f0f0;
    --muted: #555;
    --yes: #4ade80;
    --no: #f87171;
    --accent: #e8d5a3;
    --card-bg: #181818;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Instrument Sans', sans-serif;
    overflow: hidden;
    touch-action: pan-y;
  }

  /* ── SCREENS ── */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; transition: opacity 0.3s, transform 0.3s; }
  .screen.hidden { opacity: 0; pointer-events: none; transform: translateY(20px); }

  /* ── ENTRY SCREEN ── */
  #entry {
    padding: 48px 28px 40px;
    justify-content: space-between;
  }

  .wordmark {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    letter-spacing: 0.06em;
    color: var(--accent);
    line-height: 1;
  }
  .wordmark span { color: var(--muted); font-size: 14px; font-family: 'Instrument Sans', sans-serif; letter-spacing: 0.12em; display: block; margin-top: 4px; text-transform: uppercase; }

  .category-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    flex: 1;
    margin: 36px 0 28px;
    align-content: start;
  }

  .cat-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 16px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .cat-btn:active { background: #1e1e1e; }
  .cat-btn.selected { border-color: var(--accent); background: #1c1a14; }
  .cat-btn .cat-icon { font-size: 22px; margin-bottom: 8px; display: block; }
  .cat-btn .cat-name { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: var(--text); }
  .cat-btn .cat-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .describe-wrap { margin-bottom: 20px; }
  .describe-wrap label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 8px; }
  .describe-wrap textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Instrument Sans', sans-serif;
    font-size: 15px;
    padding: 14px 16px;
    resize: none;
    height: 90px;
    outline: none;
    transition: border-color 0.15s;
  }
  .describe-wrap textarea:focus { border-color: var(--accent); }
  .describe-wrap textarea::placeholder { color: var(--muted); }

  .go-btn {
    width: 100%;
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    border-radius: 12px;
    padding: 18px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .go-btn:disabled { opacity: 0.3; }

  /* ── SWIPE SCREEN ── */
  #swipe {
    justify-content: flex-start;
    overflow: hidden;
  }

  .swipe-header {
    padding: 20px 24px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .swipe-header .back-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 12px;
    padding: 6px 12px;
    cursor: pointer;
    font-family: 'Instrument Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .progress-wrap { display: flex; gap: 4px; }
  .progress-pip { width: 24px; height: 3px; border-radius: 2px; background: var(--border); transition: background 0.2s; }
  .progress-pip.done { background: var(--accent); }
  .progress-pip.current { background: var(--text); }

  .topic-label {
    padding: 14px 24px 0;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    flex-shrink: 0;
  }

  /* Card stack */
  .card-stack {
    flex: 1;
    position: relative;
    margin: 16px 20px 0;
    overflow: hidden;
  }

  .q-card {
    position: absolute;
    inset: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 26px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: grab;
    user-select: none;
    touch-action: none;
    transition: box-shadow 0.2s;
    will-change: transform;
  }
  .q-card:active { cursor: grabbing; }

  .q-card .q-meta { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; margin-bottom: 16px; }
  .q-card .q-text { font-size: 22px; line-height: 1.35; font-weight: 500; flex: 1; display: flex; align-items: center; }
  .q-card .q-hint { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 16px; }

  /* swipe feedback overlays */
  .card-yes-label, .card-no-label {
    position: absolute;
    top: 28px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 40px;
    letter-spacing: 0.08em;
    opacity: 0;
    transition: opacity 0.1s;
    pointer-events: none;
    border: 3px solid;
    border-radius: 8px;
    padding: 4px 12px;
  }
  .card-yes-label { left: 28px; color: var(--yes); border-color: var(--yes); transform: rotate(-8deg); }
  .card-no-label { right: 28px; color: var(--no); border-color: var(--no); transform: rotate(8deg); }

  .swipe-hint {
    padding: 14px 24px 8px;
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .hint-left { color: var(--no); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
  .hint-right { color: var(--yes); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }

  .swipe-btns {
    padding: 8px 24px 32px;
    display: flex;
    gap: 16px;
    flex-shrink: 0;
  }
  .swipe-btn {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 18px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 0.1em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s, opacity 0.1s;
  }
  .swipe-btn:active { transform: scale(0.96); }
  .swipe-btn.btn-no { background: #1f1212; color: var(--no); border: 1px solid #3a1a1a; }
  .swipe-btn.btn-yes { background: #121f14; color: var(--yes); border: 1px solid #1a3a1e; }

  /* loading card state */
  .loading-card {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: var(--muted);
  }
  .loader {
    width: 36px; height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }

  /* ── BUILD SCREEN ── */
  #build {
    flex-direction: column;
  }

  .build-header {
    padding: 20px 24px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .build-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.08em;
    color: var(--accent);
  }
  .build-back {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 12px;
    padding: 6px 12px;
    cursor: pointer;
    font-family: 'Instrument Sans', sans-serif;
  }

  .build-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px 32px;
    -webkit-overflow-scrolling: touch;
  }

  .build-status {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

  .build-output {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    min-height: 200px;
  }

  .copy-btn {
    margin-top: 16px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    color: var(--text);
    font-family: 'Instrument Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.04em;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.15s;
  }
  .copy-btn:active { border-color: var(--accent); }

  .answers-summary {
    margin-top: 20px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }
  .answers-summary h3 {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .answer-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .answer-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .answer-badge.yes { background: #121f14; color: var(--yes); border: 1px solid #1a3a1e; }
  .answer-badge.no { background: #1f1212; color: var(--no); border: 1px solid #3a1a1a; }
  .answer-q { font-size: 13px; color: var(--muted); line-height: 1.4; }
</style>
</head>
<body>

<!-- ENTRY SCREEN -->
<div class="screen" id="entry">
  <div>
    <div class="wordmark">DEETS<span>Get specific. Build better.</span></div>

    <div class="category-grid" id="catGrid">
      <button class="cat-btn" data-cat="App" onclick="selectCat(this)">
        <span class="cat-icon">📱</span>
        <div class="cat-name">App</div>
        <div class="cat-sub">Mobile or web tool</div>
      </button>
      <button class="cat-btn" data-cat="Website" onclick="selectCat(this)">
        <span class="cat-icon">🌐</span>
        <div class="cat-name">Website</div>
        <div class="cat-sub">Landing or full site</div>
      </button>
      <button class="cat-btn" data-cat="Feature" onclick="selectCat(this)">
        <span class="cat-icon">⚙️</span>
        <div class="cat-name">Feature</div>
        <div class="cat-sub">Add to existing build</div>
      </button>
      <button class="cat-btn" data-cat="Script / Tool" onclick="selectCat(this)">
        <span class="cat-icon">🔧</span>
        <div class="cat-name">Script / Tool</div>
        <div class="cat-sub">Utility or automation</div>
      </button>
      <button class="cat-btn" data-cat="API / Backend" onclick="selectCat(this)">
        <span class="cat-icon">🗄️</span>
        <div class="cat-name">API / Backend</div>
        <div class="cat-sub">Server, database, logic</div>
      </button>
      <button class="cat-btn" data-cat="Design / UI" onclick="selectCat(this)">
        <span class="cat-icon">🎨</span>
        <div class="cat-name">Design / UI</div>
        <div class="cat-sub">Component or screen</div>
      </button>
    </div>

    <div class="describe-wrap">
      <label>Describe what you want to build</label>
      <textarea id="descInput" placeholder="e.g. A GPS map tracker for forestry workers to log the area they've planted…" oninput="checkReady()"></textarea>
    </div>
  </div>

  <button class="go-btn" id="goBtn" disabled onclick="startDeets()">GET DEETS →</button>
</div>

<!-- SWIPE SCREEN -->
<div class="screen hidden" id="swipe">
  <div class="swipe-header">
    <button class="back-btn" onclick="goBack('swipe')">← Back</button>
    <div class="progress-wrap" id="progressPips"></div>
  </div>
  <div class="topic-label" id="topicLabel">Loading questions…</div>

  <div class="card-stack" id="cardStack">
    <div class="loading-card" id="loadingCard">
      <div class="loader"></div>
      <div class="loading-text">Generating questions…</div>
    </div>
  </div>

  <div class="swipe-hint">
    <span class="hint-left">← NO</span>
    <span class="hint-right">YES →</span>
  </div>
  <div class="swipe-btns">
    <button class="swipe-btn btn-no" onclick="answer(false)">NO</button>
    <button class="swipe-btn btn-yes" onclick="answer(true)">YES</button>
  </div>
</div>

<!-- BUILD SCREEN -->
<div class="screen hidden" id="build">
  <div class="build-header">
    <div class="build-title">BUILDING</div>
    <button class="build-back" onclick="goBack('build')">← Start over</button>
  </div>
  <div class="build-body">
    <div class="build-status"><div class="status-dot" id="statusDot"></div><span id="statusText">Claude is building…</span></div>
    <div class="build-output" id="buildOutput"></div>
    <button class="copy-btn" id="copyBtn" onclick="copyOutput()" style="display:none">Copy output</button>
    <div class="answers-summary hidden" id="answersSummary">
      <h3>Your answers</h3>
      <div id="answersLog"></div>
    </div>
  </div>
</div>

<script>
// ── STATE ──
let state = {
  category: null,
  description: '',
  questions: [],   // [{text, topic, isDeep}]
  current: 0,
  answers: [],     // [{question, answer}]
  dragging: false,
  startX: 0,
  startY: 0,
  card: null,
};

// ── ENTRY ──
function selectCat(btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  state.category = btn.dataset.cat;
  checkReady();
}

function checkReady() {
  const desc = document.getElementById('descInput').value.trim();
  document.getElementById('goBtn').disabled = !(state.category && desc.length > 5);
}

async function startDeets() {
  state.description = document.getElementById('descInput').value.trim();
  showScreen('swipe');
  await loadQuestions();
}

// ── QUESTION GENERATION ──
async function loadQuestions() {
  document.getElementById('loadingCard').style.display = 'flex';
  document.getElementById('topicLabel').textContent = 'Generating questions…';

  const prompt = `You are DEETS — a build clarification engine. The user wants to build:

Category: ${state.category}
Description: ${state.description}

Generate exactly 8 yes/no questions that clarify the most important unknowns before building this. The questions should:
- Be specific and answerable with YES or NO
- Cover: core functionality, user type, platform/stack, data/persistence, key UI decisions, edge cases
- Include 1-2 "go deeper?" questions like "Do you want to get more specific about [specific sub-topic]?" which can trigger a follow-up set
- Be ordered from broadest to most specific

Return ONLY a JSON array, no markdown, no explanation:
[
  {"text": "Question text here", "topic": "Core Functionality", "isDeep": false},
  ...
]

isDeep should be true only for the "go deeper" branching questions.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const raw = data.content[0].text.replace(/```json|```/g, '').trim();
    state.questions = JSON.parse(raw);
    state.current = 0;
    state.answers = [];
    renderProgressPips();
    showNextCard();
  } catch(e) {
    document.getElementById('topicLabel').textContent = 'Error loading questions';
    console.error(e);
  }
}

// ── PROGRESS ──
function renderProgressPips() {
  const wrap = document.getElementById('progressPips');
  wrap.innerHTML = '';
  state.questions.forEach((_, i) => {
    const pip = document.createElement('div');
    pip.className = 'progress-pip' + (i === 0 ? ' current' : '');
    pip.id = `pip-${i}`;
    wrap.appendChild(pip);
  });
}

function updatePips() {
  state.questions.forEach((_, i) => {
    const pip = document.getElementById(`pip-${i}`);
    if (!pip) return;
    pip.className = 'progress-pip' + (i < state.current ? ' done' : i === state.current ? ' current' : '');
  });
}

// ── CARD RENDERING ──
function showNextCard() {
  const stack = document.getElementById('cardStack');
  const loading = document.getElementById('loadingCard');
  loading.style.display = 'none';

  // Clear old cards
  stack.querySelectorAll('.q-card').forEach(c => c.remove());

  if (state.current >= state.questions.length) {
    startBuild();
    return;
  }

  const q = state.questions[state.current];
  document.getElementById('topicLabel').textContent = q.topic;
  updatePips();

  // Back card (peek)
  if (state.current + 1 < state.questions.length) {
    const back = makeCard(state.questions[state.current + 1], true);
    back.style.transform = 'scale(0.94) translateY(10px)';
    back.style.opacity = '0.5';
    back.style.zIndex = '1';
    stack.appendChild(back);
  }

  // Front card
  const card = makeCard(q, false);
  card.style.zIndex = '2';
  stack.appendChild(card);
  state.card = card;
  attachDrag(card);
}

function makeCard(q, isBehind) {
  const card = document.createElement('div');
  card.className = 'q-card';
  card.innerHTML = `
    <div>
      <div class="q-meta">${q.isDeep ? '↳ Go deeper?' : 'Question ' + (state.questions.indexOf(q) + 1) + ' of ' + state.questions.length}</div>
      <div class="q-text">${q.text}</div>
    </div>
    <div class="q-hint">${q.isDeep ? 'YES = more specific questions on this topic' : 'Swipe right for YES · left for NO'}</div>
    <div class="card-yes-label">YES</div>
    <div class="card-no-label">NO</div>
  `;
  if (isBehind) {
    card.style.pointerEvents = 'none';
  }
  return card;
}

// ── DRAG ──
function attachDrag(card) {
  let startX, startY, isDragging = false;

  const onStart = (x, y) => { startX = x; startY = y; isDragging = true; };
  const onMove = (x, y) => {
    if (!isDragging) return;
    const dx = x - startX;
    const dy = (y - startY) * 0.3;
    const rot = dx * 0.08;
    card.style.transition = 'none';
    card.style.transform = `translateX(${dx}px) translateY(${dy}px) rotate(${rot}deg)`;
    const yesLabel = card.querySelector('.card-yes-label');
    const noLabel = card.querySelector('.card-no-label');
    const ratio = Math.min(Math.abs(dx) / 100, 1);
    if (dx > 20) { yesLabel.style.opacity = ratio; noLabel.style.opacity = 0; }
    else if (dx < -20) { noLabel.style.opacity = ratio; yesLabel.style.opacity = 0; }
    else { yesLabel.style.opacity = 0; noLabel.style.opacity = 0; }
  };
  const onEnd = (x) => {
    if (!isDragging) return;
    isDragging = false;
    const dx = x - startX;
    if (Math.abs(dx) > 80) {
      flingCard(card, dx > 0);
    } else {
      card.style.transition = 'transform 0.3s';
      card.style.transform = '';
      card.querySelector('.card-yes-label').style.opacity = 0;
      card.querySelector('.card-no-label').style.opacity = 0;
    }
  };

  card.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => { if (isDragging) onMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', e => { if (isDragging) onEnd(e.clientX); });

  card.addEventListener('touchstart', e => { const t = e.touches[0]; onStart(t.clientX, t.clientY); }, { passive: true });
  card.addEventListener('touchmove', e => { const t = e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: true });
  card.addEventListener('touchend', e => { const t = e.changedTouches[0]; onEnd(t.clientX); });
}

function flingCard(card, isYes) {
  card.style.transition = 'transform 0.35s ease-in, opacity 0.35s';
  card.style.transform = `translateX(${isYes ? 600 : -600}px) rotate(${isYes ? 20 : -20}deg)`;
  card.style.opacity = '0';
  recordAnswer(isYes);
  setTimeout(() => card.remove(), 350);
}

// ── ANSWER ──
function answer(isYes) {
  if (!state.card) return;
  flingCard(state.card, isYes);
}

async function recordAnswer(isYes) {
  const q = state.questions[state.current];
  state.answers.push({ question: q.text, answer: isYes, isDeep: q.isDeep });

  // If it's a "go deeper" question and they said yes, load sub-questions
  if (q.isDeep && isYes) {
    state.current++;
    updatePips();
    document.getElementById('loadingCard').style.display = 'flex';
    document.getElementById('topicLabel').textContent = 'Going deeper…';
    await loadDeepQuestions(q.text);
    return;
  }

  state.current++;
  setTimeout(showNextCard, 80);
}

async function loadDeepQuestions(deepQuestion) {
  const prompt = `The user is building: ${state.description} (${state.category}).
They said YES to: "${deepQuestion}"
Generate 3 more specific yes/no questions drilling into this topic.
Return ONLY JSON array:
[{"text": "...", "topic": "Detail", "isDeep": false}]`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 500,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const raw = data.content[0].text.replace(/```json|```/g, '').trim();
    const extra = JSON.parse(raw);
    // Splice in after current position
    state.questions.splice(state.current, 0, ...extra);
    renderProgressPips();
    updatePips();
    document.getElementById('loadingCard').style.display = 'none';
    showNextCard();
  } catch(e) {
    document.getElementById('loadingCard').style.display = 'none';
    showNextCard();
  }
}

// ── BUILD ──
async function startBuild() {
  showScreen('build');
  document.getElementById('statusDot').style.animation = 'pulse 1.2s ease-in-out infinite';
  document.getElementById('statusText').textContent = 'Claude is building…';
  document.getElementById('copyBtn').style.display = 'none';
  document.getElementById('buildOutput').textContent = '';
  document.getElementById('answersSummary').classList.add('hidden');

  // Render answers summary
  const log = document.getElementById('answersLog');
  log.innerHTML = '';
  state.answers.forEach(a => {
    const div = document.createElement('div');
    div.className = 'answer-item';
    div.innerHTML = `<span class="answer-badge ${a.answer ? 'yes' : 'no'}">${a.answer ? 'YES' : 'NO'}</span><span class="answer-q">${a.question}</span>`;
    log.appendChild(div);
  });

  const answersText = state.answers.map(a => `- ${a.question}: ${a.answer ? 'YES' : 'NO'}`).join('\n');

  const prompt = `You are a senior developer. Based on the following spec answers, build the requested ${state.category}.

What they want: ${state.description}

Spec answers:
${answersText}

Build this now. Write complete, working, production-ready code. Include everything needed. Add a brief comment block at the top summarising what was built based on their answers.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const output = data.content.map(b => b.text || '').join('');
    document.getElementById('buildOutput').textContent = output;
    document.getElementById('statusDot').style.animation = 'none';
    document.getElementById('statusDot').style.background = '#4ade80';
    document.getElementById('statusText').textContent = 'Done';
    document.getElementById('copyBtn').style.display = 'block';
    document.getElementById('answersSummary').classList.remove('hidden');
  } catch(e) {
    document.getElementById('buildOutput').textContent = 'Error connecting to Claude. Check your API key.';
    document.getElementById('statusText').textContent = 'Error';
  }
}

// ── COPY ──
function copyOutput() {
  navigator.clipboard.writeText(document.getElementById('buildOutput').textContent);
  document.getElementById('copyBtn').textContent = 'Copied ✓';
  setTimeout(() => document.getElementById('copyBtn').textContent = 'Copy output', 1800);
}

// ── NAV ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function goBack(from) {
  if (from === 'swipe') showScreen('entry');
  if (from === 'build') { resetAll(); showScreen('entry'); }
}

function resetAll() {
  state = { category: null, description: '', questions: [], current: 0, answers: [], dragging: false, startX: 0, startY: 0, card: null };
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('descInput').value = '';
  document.getElementById('goBtn').disabled = true;
}
</script>
